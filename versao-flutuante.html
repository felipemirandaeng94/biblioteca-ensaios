<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef1ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="ime.png">
<link rel="apple-touch-icon" href="ime.png">
<title>Biblioteca de Ensaios LET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: mesa digital clara; cabeçalho mínimo, barra flutuante de busca e filtros, folhas A4 suspensas em composição alternada (colmeia) com profundidade, flutuação e parallax; visualizador escuro com desfoque */
:root{
  color-scheme: light;
  --bg:#eef1ec;
  --bg-2:#f7f8f5;
  --ink:#1b211d;
  --ink-2:#4b554e;
  --ink-3:#7a847d;
  --line:rgba(27,33,29,.12);
  --glass:rgba(255,255,255,.72);
  --accent:#1f6b3a;
  --accent-soft:rgba(31,107,58,.12);
  --viewer:rgba(16,20,18,.86);
  --viewer-solid:#151917;
  --viewer-2:#262b28;
  --viewer-line:rgba(255,255,255,.10);
  --viewer-fg:#eef1ec;
  --viewer-mut:#a3aca5;
  --mint:#8fd0a2;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh;
  background:
    radial-gradient(900px 520px at 12% 18%, rgba(143,208,162,.28), transparent 60%),
    radial-gradient(800px 600px at 92% 8%, rgba(214,201,150,.22), transparent 60%),
    radial-gradient(1000px 700px at 60% 100%, rgba(31,107,58,.10), transparent 60%),
    linear-gradient(180deg,var(--bg-2),var(--bg));
  background-attachment:fixed;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden}
/* grade técnica muito discreta */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(27,33,29,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(27,33,29,.045) 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 30%,transparent 80%);mask-image:radial-gradient(ellipse 80% 70% at 50% 40%,#000 30%,transparent 80%)}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding-inline:clamp(16px,4vw,40px)}

/* ---------- cabeçalho mínimo ---------- */
header .wrap{display:flex;align-items:center;gap:14px;padding-block:clamp(16px,2.6vw,26px) 8px}
.crest{width:clamp(38px,4.4vw,48px);height:auto;flex:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.18))}
.mh{min-width:0;flex:1}
h1{margin:0;font-size:clamp(19px,2.4vw,24px);line-height:1.15;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
.mh p{margin:2px 0 0;color:var(--ink-2);font-size:14px}
.count-pill{flex:none;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink-2);background:var(--glass);
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.count-pill b{color:var(--accent);font-weight:600}

/* ---------- barra flutuante ---------- */
.tools{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:20;margin-top:10px}
.bar{display:flex;align-items:center;gap:10px;padding:6px;border-radius:999px;background:var(--glass);border:1px solid var(--line);
  box-shadow:0 10px 30px -18px rgba(20,40,28,.45);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2)}
.search{position:relative;flex:1 1 300px;min-width:0;max-width:440px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-3);pointer-events:none}
.search input{width:100%;height:40px;border:1px solid transparent;border-radius:999px;background:rgba(255,255,255,.9);
  padding:0 38px 0 40px;font:inherit;font-size:14.5px;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.search input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.search input::placeholder{color:var(--ink-3)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search .x{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:transparent;cursor:pointer;color:var(--ink-3);font-size:18px;line-height:1}
.search .x:hover{background:rgba(0,0,0,.06);color:var(--ink)}
.chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;min-width:0;flex:0 1 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;border-radius:999px;border:0;background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);transition:background .25s var(--ease),color .25s}
.chip:hover{background:rgba(0,0,0,.05);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff;box-shadow:0 6px 14px -8px rgba(31,107,58,.8)}
.status{position:relative;z-index:1;font-size:12.5px;color:var(--ink-3);padding:10px 18px 0;min-height:28px}
.status b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* ---------- mesa flutuante ---------- */
.stage{position:relative;margin-top:8px;transition:height .7s var(--ease);perspective:1400px}
.doc{position:absolute;left:0;top:0;width:var(--w);
  transform:translate3d(var(--x),var(--y),0) scale(var(--s));transform-origin:50% 40%;
  transition:transform .9s var(--ease),opacity .5s ease;z-index:var(--z)}
.doc.out{opacity:0;pointer-events:none;transform:translate3d(var(--x),calc(var(--y) + 40px),0) scale(calc(var(--s) * .82))}
.doc.in{animation:docin .8s var(--ease) both;animation-delay:var(--dl,0ms)}
@keyframes docin{from{opacity:0;transform:translate3d(var(--x),calc(var(--y) + 50px),0) scale(calc(var(--s) * .85))}}
.doc:hover,.doc:focus-within{z-index:30}
.doc::before{content:"";position:absolute;inset:-6px;cursor:pointer}
.par{transform:translate3d(calc(var(--mx,0) * var(--d) * 1px),calc(var(--my,0) * var(--d) * 1px),0);transition:transform .6s var(--ease);will-change:transform}
.float{animation:float var(--fd,8s) ease-in-out infinite;animation-delay:var(--fdl,0s)}
@keyframes float{
  0%,100%{transform:translate3d(0,0,0) rotate(var(--r0,0deg))}
  50%{transform:translate3d(var(--fx,2px),var(--fy,-9px),0) rotate(var(--r1,0deg))}
}
.doc:hover .float,.doc:focus-within .float{animation-play-state:paused}
.open{all:unset;display:block;cursor:pointer;width:100%;-webkit-tap-highlight-color:transparent}
.tilt{transform:perspective(900px) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg)) translateY(0) scale(1);transform-style:preserve-3d;
  transition:transform .5s var(--ease)}
.doc:hover .tilt,.open:focus-visible .tilt{transform:perspective(900px) rotateX(var(--tx,0deg)) rotateY(var(--ty,0deg)) translateY(-14px) scale(1.06);transition:transform .25s var(--ease)}
.sheet{position:relative;aspect-ratio:1075/1521;background:#fff;border-radius:2px;overflow:hidden;
  box-shadow:0 1px 1px rgba(0,0,0,.06),0 calc(var(--d) * 2px + 8px) calc(var(--d) * 4px + 18px) calc(var(--d) * -1px - 6px) rgba(20,40,28,calc(.18 + var(--d) * .03));
  outline:1px solid rgba(0,0,0,.05);transition:box-shadow .35s var(--ease)}
.doc:hover .sheet,.open:focus-visible .sheet{box-shadow:0 2px 3px rgba(0,0,0,.08),0 40px 60px -22px rgba(20,40,28,.55)}
.sheet img{width:100%;height:100%;object-fit:cover;object-position:top}
/* reflexo de luz suave na folha */
.sheet::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.35) 50%,rgba(255,255,255,0) 60%);
  transform:translateX(-120%);transition:transform .9s var(--ease);pointer-events:none}
.doc:hover .sheet::after{transform:translateX(120%)}
.pages-badge{position:absolute;top:8px;right:8px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--ink-2);
  background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;padding:1px 7px}
.view{position:absolute;left:50%;bottom:14px;transform:translate(-50%,10px);opacity:0;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  padding:8px 14px;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  transition:opacity .25s,transform .3s var(--ease);box-shadow:0 10px 20px -10px rgba(0,0,0,.6)}
.doc:hover .view,.open:focus-visible .view{opacity:1;transform:translate(-50%,0)}
.tag{margin-top:14px;padding-inline:2px;transition:transform .3s var(--ease)}
.doc:hover .tag{transform:translateY(-6px)}
.tag .code{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.06em;color:var(--accent)}
.tag .name{display:block;font-size:15.5px;line-height:1.25;font-weight:600;color:var(--ink);margin-top:1px;text-wrap:balance}
.tag .meta{display:block;font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.tag .meta .n{font-family:var(--mono);color:var(--ink-2)}
.nw{white-space:nowrap}
mark{background:#fff0a0;color:inherit;border-radius:2px;padding:0 1px}

.empty{position:relative;z-index:1;text-align:center;color:var(--ink-2);padding:70px 16px}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.empty button{margin-top:14px;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--accent);background:rgba(255,255,255,.7);color:var(--accent);cursor:pointer;
  font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

footer .wrap{display:flex;gap:6px 14px;flex-wrap:wrap;justify-content:space-between;padding-block:28px 26px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);margin-top:24px}
footer b{font-family:var(--mono);color:var(--ink-2);letter-spacing:.05em}

/* ---------- visualizador ---------- */
.viewer{position:fixed;inset:0;z-index:100;display:grid;grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);
  background:var(--viewer);color:var(--viewer-fg);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  animation:vfade .35s var(--ease)}
.viewer.closing{animation:vout .28s ease forwards}
@keyframes vfade{from{background:rgba(16,20,18,0);backdrop-filter:blur(0)}}
@keyframes vout{to{opacity:0}}
.viewer.closing .pages{transform:scale(.96);opacity:0;transition:transform .28s ease,opacity .28s ease}
.vbar,.vfoot{animation:barin .45s var(--ease) both}
.vfoot{animation-delay:.05s}
@keyframes barin{from{opacity:0}}
.vbar{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 10px) clamp(12px,2vw,22px) 10px;border-bottom:1px solid var(--viewer-line)}
.vtitle{min-width:0;flex:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.vcode{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--mint)}
.vname{font-size:16px;font-weight:600;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vnorm{font-family:var(--mono);font-size:12px;color:var(--viewer-mut)}
.vtools{display:flex;align-items:center;gap:4px;flex:none}
.sep{width:1px;height:22px;background:var(--viewer-line);margin:0 6px}
.ib{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:0;background:transparent;color:var(--viewer-fg);cursor:pointer;transition:background .15s}
.ib:hover{background:var(--viewer-2)}
.ib[aria-pressed="true"]{background:var(--viewer-2);color:var(--mint)}
.ib svg{width:19px;height:19px}
.ib:focus-visible{outline:2px solid var(--mint);outline-offset:1px}
.zoomval{min-width:50px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--viewer-mut);font-variant-numeric:tabular-nums}
.canvas{position:relative;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pages{display:flex;flex-direction:column;align-items:center;gap:18px;padding:24px 16px 30px;min-width:min-content;margin:0 auto}
.page{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.35),0 30px 70px -26px rgba(0,0,0,.8);flex:none;transform-origin:0 0}
.page img{width:100%;height:auto}
.canvas.slide-next .pages{animation:sn .45s var(--ease)}
.canvas.slide-prev .pages{animation:sp .45s var(--ease)}
@keyframes sn{from{opacity:0;transform:translateX(50px) rotate(.6deg)}}
@keyframes sp{from{opacity:0;transform:translateX(-50px) rotate(-.6deg)}}
.vfoot{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;
  padding:10px clamp(12px,2vw,22px) calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1px solid var(--viewer-line)}
.nb{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--viewer-line);background:transparent;cursor:pointer;
  font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--viewer-fg);transition:background .2s,border-color .2s,transform .2s var(--ease)}
.nb:hover{background:var(--viewer-2);border-color:rgba(255,255,255,.22)}
#prev:hover{transform:translateX(-3px)}#next:hover{transform:translateX(3px)}
.nb:focus-visible{outline:2px solid var(--mint)}
.progress{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.pcount{font-family:var(--mono);font-size:13px;color:var(--viewer-mut);font-variant-numeric:tabular-nums}
.pcount b{color:var(--viewer-fg);font-weight:600}
.segs{display:flex;gap:4px;width:min(420px,100%)}
.seg{flex:1;height:14px;border:0;background:transparent;padding:5px 0;cursor:pointer;position:relative}
.seg::before{content:"";display:block;height:4px;border-radius:2px;background:rgba(255,255,255,.14);transition:background .3s}
.seg.done::before{background:#5f8f6c}
.seg.cur::before{background:var(--mint)}
.seg:hover::before{background:#c8d4cb}
.seg .tip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;white-space:nowrap;background:#000;color:#fff;
  padding:3px 6px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .15s}
.seg:hover .tip,.seg:focus-visible .tip{opacity:1}
.seg:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:2px}

/* ---------- responsivo ---------- */
@media (max-width:860px){
  .bar{flex-direction:column;align-items:stretch;border-radius:22px;padding:8px}
  .bar>*{min-width:0;max-width:100%}
  .search{max-width:none;flex:1 1 auto}
  .status{padding-inline:6px}
}
@media (max-width:640px){
  .count-pill{display:none}
  .mh p{font-size:13px}
  .tag .name{font-size:16.5px}
  .vnorm{display:none}
  .vtools .opt,.vtools .sep{display:none}
  .vfoot{gap:10px}
  .nb .lbl{display:none}
  .nb{width:46px;padding:0;justify-content:center}
}
@media (hover:none){
  .view{opacity:1;transform:translate(-50%,0);font-size:10.5px;padding:6px 11px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <img class="crest" src="ime.png" alt="Brasão do IME" width="48" height="64">
    <div class="mh">
      <h1>Biblioteca de Ensaios</h1>
      <p>Modelos de documentos gerados pela plataforma LET</p>
    </div>
    <span class="count-pill"><b id="total">12</b> ensaios</span>
  </div>
</header>

<div class="wrap tools">
  <div class="bar">
    <label class="search" for="q">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Pesquisar ensaio, código ou norma..." autocomplete="off" aria-label="Pesquisar ensaio, código ou norma">
      <button class="x" id="qx" type="button" aria-label="Limpar busca" hidden>×</button>
    </label>
    <div class="chips" id="chips" role="group" aria-label="Filtrar por camada"></div>
  </div>
</div>

<main class="wrap">
  <div class="status" id="status" aria-live="polite"></div>
  <div class="stage" id="stage"></div>
  <div class="empty" id="empty" hidden>
    <b>Nenhum modelo encontrado</b>
    Tente outro termo ou outra camada.
    <div><button type="button" id="reset">Limpar busca e filtros</button></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <span><b>LET-Sys</b> · Laboratório de Ensaios Técnicos · IME</span>
    <span>Modelos demonstrativos com dados fictícios</span>
  </div>
</footer>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-labelledby="vname" hidden>
  <div class="vbar">
    <div class="vtitle">
      <span class="vcode" id="vcode"></span>
      <span class="vname" id="vname"></span>
      <span class="vnorm" id="vnorm"></span>
    </div>
    <div class="vtools">
      <button class="ib" id="zout" aria-label="Diminuir zoom" title="Diminuir zoom (−)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M20 20l-3.5-3.5"/></svg></button>
      <span class="zoomval opt" id="zval">100%</span>
      <button class="ib" id="zin" aria-label="Aumentar zoom" title="Aumentar zoom (+)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M8 11h6M11 8v6M20 20l-3.5-3.5"/></svg></button>
      <span class="sep"></span>
      <button class="ib opt" id="fitp" aria-label="Ajustar à tela" title="Ajustar à tela (0)" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="1.5"/></svg></button>
      <button class="ib opt" id="fitw" aria-label="Ajustar à largura" title="Ajustar à largura" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/></svg></button>
      <button class="ib opt" id="fs" aria-label="Tela cheia" title="Tela cheia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <span class="sep"></span>
      <button class="ib" id="vclose" aria-label="Fechar (Esc)" title="Fechar (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>
  <div class="canvas" id="canvas"><div class="pages" id="pages"></div></div>
  <div class="vfoot">
    <button class="nb" id="prev" aria-label="Modelo anterior"><span aria-hidden="true">←</span><span class="lbl">Anterior</span></button>
    <div class="progress">
      <div class="pcount"><b id="pi">01</b> / <span id="pn">12</span></div>
      <div class="segs" id="segs"></div>
    </div>
    <button class="nb" id="next" aria-label="Próximo modelo"><span class="lbl">Próximo</span><span aria-hidden="true">→</span></button>
  </div>
</div>

<script>
const LAYERS = [
  {id:"rev",  nome:"Revestimento",          cls:"l-rev"},
  {id:"base", nome:"Base",                  cls:"l-base"},
  {id:"sub",  nome:"Sub-base",              cls:"l-sub"},
  {id:"ref",  nome:"Reforço do subleito",   cls:"l-ref"},
  {id:"subl", nome:"Subleito",              cls:"l-subl"}
];
const SOLO = ["base","sub","ref","subl"];
const ENSAIOS = [
  {code:"ATT", reg:"ATT-003", pags:1, nome:"Limites de Atterberg", norma:"NBR 6459 · NBR 7180", camadas:SOLO,

/* versão das imagens: troque a cada atualização de imagens para forçar recarga */
const V = "20261006c";
const thumb = e=>`${e.reg}-thumb.jpg?v=${V}`;
const pageSrc = (e,n)=>`${e.reg}-${n}.jpg?v=${V}`;
const PAGE_W = 1075, PAGE_H = 1521, A4_PX = 794;

const $ = s=>document.querySelector(s);
const pad = n=>String(n).padStart(2,"0");
const layerOf = id=>LAYERS.find(l=>l.id===id);
const norm = t=>String(t).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const esc = t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ORDER = ["subl","ref","sub","base","rev"];
const CHIP_LABEL = {subl:"Subleito",ref:"Reforço",sub:"Sub-base",base:"Base",rev:"Revestimento"};
const layersHTML = e=>ORDER.filter(id=>e.camadas.includes(id)).map(id=>`<span class="nw">${esc(layerOf(id).nome)}</span>`).join(" · ");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const touch = matchMedia("(hover: none)").matches;

ENSAIOS.forEach(e=>{
  e._hay = norm([e.code,e.reg,e.nome,e.norma,e.desc,e.mede,e.amostra,e.uso,e.camadas.map(id=>layerOf(id).nome).join(" ")].join(" "));
});
$("#total").textContent = ENSAIOS.length;

/* pseudo-aleatório estável por documento */
const rnd = (i,k)=>{ const x=Math.sin(i*127.1+k*311.7)*43758.5453; return x-Math.floor(x); };

/* ---------- filtros e busca ---------- */
let layer=null, query="";
const chips=$("#chips");
[["all","Todos"],...ORDER.map(id=>[id,CHIP_LABEL[id]])].forEach(([id,label])=>{
  const b=document.createElement("button");
  b.className="chip"; b.type="button"; b.dataset.id=id; b.textContent=label;
  b.setAttribute("aria-pressed",String(id==="all"));
  b.onclick=()=>{ layer=id==="all"?null:id; update(); };
  chips.appendChild(b);
});
const q=$("#q"), qx=$("#qx");
q.addEventListener("input",()=>{ query=q.value; qx.hidden=!query; update(); });
qx.onclick=()=>{ q.value=""; query=""; qx.hidden=true; update(); q.focus(); };
$("#reset").onclick=()=>{ q.value=""; query=""; qx.hidden=true; layer=null; update(); };

function hl(text){
  const terms=norm(query).split(/\s+/).filter(Boolean);
  if(!terms.length) return esc(text);
  const n=norm(text), m=new Array(text.length).fill(false);
  terms.forEach(t=>{ let i=n.indexOf(t); while(i>-1){ for(let k=i;k<i+t.length;k++) m[k]=true; i=n.indexOf(t,i+1);} });
  let out="",open=false;
  for(let i=0;i<text.length;i++){ if(m[i]&&!open){out+="<mark>";open=true} if(!m[i]&&open){out+="</mark>";open=false} out+=esc(text[i]); }
  return out+(open?"</mark>":"");
}

/* ---------- documentos ---------- */
const stage=$("#stage");
const docs = ENSAIOS.map((e,i)=>{
  const d = [1,0,2,1,2,0,1,2,0,2,1,0][i%12];               /* camada de profundidade 0..2 */
  const el=document.createElement("div");
  el.className="doc"; el.dataset.i=i;
  el.style.setProperty("--d",d);
  el.style.setProperty("--fd",(7+rnd(i,1)*5).toFixed(2)+"s");
  el.style.setProperty("--fdl",(-rnd(i,2)*8).toFixed(2)+"s");
  el.style.setProperty("--fy",(-(5+rnd(i,3)*6)).toFixed(1)+"px");
  el.style.setProperty("--fx",((rnd(i,4)-.5)*5).toFixed(1)+"px");
  el.style.setProperty("--r0",((rnd(i,5)-.5)*1.6).toFixed(2)+"deg");
  el.style.setProperty("--r1",((rnd(i,6)-.5)*1.6).toFixed(2)+"deg");
  el.innerHTML=`<div class="par"><div class="float">
    <button class="open" type="button" aria-label="Visualizar ${esc(e.reg)}, ${esc(e.nome)}">
      <div class="tilt">
        <div class="sheet"><img src="${thumb(e)}" alt="" loading="lazy" width="${PAGE_W}" height="${PAGE_H}">
          ${e.pags>1?`<span class="pages-badge">${e.pags} folhas</span>`:""}
          <span class="view">Visualizar <span aria-hidden="true">↗</span></span>
        </div>
      </div>
      <div class="tag"></div>
    </button></div></div>`;
  el.querySelector(".open").onclick=ev=>{ ev.stopPropagation(); openViewer(i, el.querySelector(".sheet")); };
  el.addEventListener("click",()=>openViewer(i, el.querySelector(".sheet")));
  /* inclinação conforme a posição do mouse sobre a folha */
  if(!touch && !reduce){
    const t=el.querySelector(".tilt");
    el.addEventListener("pointermove",ev=>{
      const r=t.getBoundingClientRect(); const px=(ev.clientX-r.left)/r.width-.5, py=(ev.clientY-r.top)/r.height-.5;
      t.style.setProperty("--ty",(px*8).toFixed(2)+"deg"); t.style.setProperty("--tx",(-py*6).toFixed(2)+"deg");
    });
    el.addEventListener("pointerleave",()=>{ t.style.setProperty("--ty","0deg"); t.style.setProperty("--tx","0deg"); });
  }
  stage.appendChild(el);
  return {el,e,i,d,shown:false};
});

/* composição: fileiras alternadas (c, c-1, c, …) centralizadas — a fileira menor fica deslocada meia coluna —
   com pequenos desníveis entre colunas e variação de escala conforme a profundidade */
let visible=[];
function compose(){
  const W=stage.clientWidth, mobile=W<640;
  let w,gapX,cols;
  if(mobile){ w=Math.min(W*0.68,300); cols=1; gapX=0; }
  else{
    w = W>1180 ? 226 : W>900 ? 208 : 192;
    gapX = Math.max(40, W*0.04);
    cols = Math.max(2, Math.floor((W+gapX)/(w+gapX)));
    if(cols>5) cols=5;
  }
  const sheetH=w*PAGE_H/PAGE_W, tagH=104;
  const rowH = sheetH+tagH+(mobile?34:56);
  const pos=new Map(); let k=0,row=0,maxY=0;
  while(k<visible.length){
    const cap = mobile?1:(row%2===0?cols:Math.max(1,cols-1));
    const n=Math.min(cap,visible.length-k);
    const x0=(W-(n*w+(n-1)*gapX))/2;
    for(let j=0;j<n;j++,k++){
      const idx=visible[k], d=docs[idx].d;
      let x,y;
      if(mobile){
        x=(W-w)/2+(k%2===0?-1:1)*Math.min(W*0.09,40)+(rnd(idx,7)-.5)*8;
        y=row*rowH+(rnd(idx,8)-.5)*8;
      }else{
        x=x0+j*(w+gapX)+(rnd(idx,9)-.5)*22;
        y=row*rowH+((j+row)%2?30:0)+(rnd(idx,10)-.5)*22;
      }
      const s=mobile?1:[0.92,0.96,1.0][d];
      pos.set(idx,{x,y,s,w});
      maxY=Math.max(maxY,y+(sheetH+tagH)*s);
    }
    row++;
  }
  stage.style.height=Math.ceil(maxY+40)+"px";
  return pos;
}

function update(first){
  chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String((layer||"all")===c.dataset.id)));
  const terms=norm(query).split(/\s+/).filter(Boolean);
  visible = docs.filter(({e})=>(!layer||e.camadas.includes(layer)) && terms.every(t=>e._hay.includes(t))).map(d=>d.i);
  const pos=compose();
  let n=0;
  docs.forEach(D=>{
    const {el,e,i}=D, p=pos.get(i);
    el.querySelector(".tag").innerHTML=`<span class="code">${hl(e.reg)}</span>
      <span class="name">${hl(e.nome)}</span>
      <span class="meta"><span class="n">${hl(e.norma)}</span><br>${layersHTML(e)}</span>`;
    if(p){
      el.style.setProperty("--x",p.x.toFixed(1)+"px"); el.style.setProperty("--y",p.y.toFixed(1)+"px");
      el.style.setProperty("--s",p.s); el.style.setProperty("--w",p.w.toFixed(1)+"px");
      el.style.setProperty("--z",String(10+D.d));
      el.classList.remove("out");
      if(!D.shown || first){ el.style.setProperty("--dl",(n*60)+"ms"); el.classList.remove("in"); void el.offsetWidth; el.classList.add("in"); }
      D.shown=true; n++;
    }else{
      el.classList.add("out"); el.classList.remove("in"); D.shown=false;
    }
  });
  $("#empty").hidden = visible.length>0;
  const parts=[]; if(layer) parts.push(CHIP_LABEL[layer]); if(query.trim()) parts.push(`“${esc(query.trim())}”`);
  $("#status").innerHTML = `Exibindo <b>${visible.length}</b> de ${ENSAIOS.length} modelos${parts.length?" · "+parts.join(" · "):""}`;
}
let rt; addEventListener("resize",()=>{ clearTimeout(rt); rt=setTimeout(()=>{ const p=compose(); docs.forEach(D=>{const v=p.get(D.i); if(v){D.el.style.setProperty("--x",v.x+"px");D.el.style.setProperty("--y",v.y+"px");D.el.style.setProperty("--s",v.s);D.el.style.setProperty("--w",v.w+"px");}}); if(!viewer.hidden) layout(); },120); });

/* parallax muito suave conforme o mouse (desligado em toque) */
if(!touch && !reduce){
  let tx=0,ty=0,cx=0,cy=0,raf=null;
  addEventListener("pointermove",ev=>{
    tx=(ev.clientX/innerWidth-.5)*2; ty=(ev.clientY/innerHeight-.5)*2;
    if(!raf) raf=requestAnimationFrame(tick);
  });
  function tick(){
    cx+= (tx-cx)*.08; cy+=(ty-cy)*.08;
    stage.style.setProperty("--mx",(cx*3).toFixed(3)); stage.style.setProperty("--my",(cy*2.2).toFixed(3));
    raf = (Math.abs(tx-cx)>.002||Math.abs(ty-cy)>.002) ? requestAnimationFrame(tick) : null;
  }
}

/* ---------- visualizador ---------- */
const viewer=$("#viewer"), canvas=$("#canvas"), pagesEl=$("#pages");
let cur=0, mode="fit", scale=1, lastFocus=null;
const navList=()=> visible.includes(cur)&&visible.length ? visible : ENSAIOS.map((_,i)=>i);
const segs=$("#segs");
function buildSegs(){
  segs.innerHTML = navList().map(i=>`<button class="seg" data-i="${i}" aria-label="${esc(ENSAIOS[i].reg)}"><span class="tip">${esc(ENSAIOS[i].reg)}</span></button>`).join("");
  segs.querySelectorAll(".seg").forEach(s=>s.onclick=()=>go(+s.dataset.i));
}
function pageWidth(){
  const cw=canvas.clientWidth-32, ch=canvas.clientHeight-54;
  if(mode==="fit") return Math.max(160,Math.min(cw,ch*PAGE_W/PAGE_H));
  if(mode==="width") return Math.max(160,Math.min(cw,1400));
  return A4_PX*scale;
}
function layout(){
  const w=Math.round(pageWidth());
  pagesEl.querySelectorAll(".page").forEach(p=>p.style.width=w+"px");
  $("#zval").textContent=Math.round(w/A4_PX*100)+"%";
  $("#fitp").setAttribute("aria-pressed",String(mode==="fit"));
  $("#fitw").setAttribute("aria-pressed",String(mode==="width"));
}
function setZoom(dir){
  const steps=[.5,.67,.75,.9,1,1.1,1.25,1.5,1.75,2,2.5,3], s=pageWidth()/A4_PX;
  scale = dir>0 ? (steps.find(v=>v>s+.01)||3) : ([...steps].reverse().find(v=>v<s-.01)||.5);
  mode="custom"; layout();
}
function show(i,dir){
  cur=i; const e=ENSAIOS[i], list=navList(), p=list.indexOf(i);
  $("#vcode").textContent=e.reg; $("#vname").textContent=e.nome; $("#vnorm").textContent=e.norma;
  $("#pi").textContent=pad(p+1); $("#pn").textContent=pad(list.length);
  pagesEl.innerHTML=Array.from({length:e.pags},(_,k)=>`<div class="page"><img src="${pageSrc(e,k+1)}" alt="${esc(e.reg)}, folha ${k+1} de ${e.pags}" width="${PAGE_W}" height="${PAGE_H}"></div>`).join("");
  layout(); canvas.scrollTop=0; canvas.scrollLeft=0;
  canvas.classList.remove("slide-next","slide-prev");
  if(dir){ void canvas.offsetWidth; canvas.classList.add(dir>0?"slide-next":"slide-prev"); }
  segs.querySelectorAll(".seg").forEach((s,k)=>{ s.classList.toggle("cur",k===p); s.classList.toggle("done",k<p); s.setAttribute("aria-current",String(k===p)); });
  [list[(p+1)%list.length],list[(p-1+list.length)%list.length]].forEach(j=>{ const im=new Image(); im.src=pageSrc(ENSAIOS[j],1); });
  try{history.replaceState(null,"","#"+e.reg.toLowerCase())}catch(_){}
}
function go(i){ const l=navList(); show(i, l.indexOf(i)>l.indexOf(cur)?1:-1); }
function step(d){ const l=navList(), p=l.indexOf(cur); show(l[(p+d+l.length)%l.length],d); }

/* a folha flutuante "expande" até a posição do visualizador */
function expandFrom(sheet){
  if(!sheet||reduce) return;
  const first=pagesEl.querySelector(".page"); if(!first) return;
  const a=sheet.getBoundingClientRect(), b=first.getBoundingClientRect();
  if(!b.width) return;
  const sx=a.width/b.width;
  first.style.transition="none";
  first.style.transform=`translate(${a.left-b.left}px,${a.top-b.top}px) scale(${sx})`;
  first.getBoundingClientRect();
  first.style.transition="transform .6s cubic-bezier(.22,.7,.2,1)";
  first.style.transform="none";
  first.addEventListener("transitionend",()=>{first.style.transition="";first.style.transform="";},{once:true});
}
function openViewer(i,sheet){
  lastFocus=document.activeElement; cur=i; mode="fit";
  viewer.classList.remove("closing"); viewer.hidden=false; document.documentElement.style.overflow="hidden";
  buildSegs(); show(i,0); expandFrom(sheet); $("#vclose").focus({preventScroll:true});
}
function closeViewer(){
  if(document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}
  const done=()=>{ viewer.hidden=true; viewer.classList.remove("closing"); document.documentElement.style.overflow="";
    const d=docs[cur].el.querySelector(".open"); (d||lastFocus)?.focus?.({preventScroll:false}); };
  if(reduce){ done(); return; }
  viewer.classList.add("closing"); setTimeout(done,260);
}
$("#vclose").onclick=closeViewer;
$("#prev").onclick=()=>step(-1);
$("#next").onclick=()=>step(1);
$("#zin").onclick=()=>setZoom(1);
$("#zout").onclick=()=>setZoom(-1);
$("#fitp").onclick=()=>{mode="fit";layout()};
$("#fitw").onclick=()=>{mode="width";layout()};
const fsBtn=$("#fs");
if(!(viewer.requestFullscreen||viewer.webkitRequestFullscreen)) fsBtn.hidden=true;
fsBtn.onclick=()=>{
  if(document.fullscreenElement||document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
  const r=(viewer.requestFullscreen||viewer.webkitRequestFullscreen).call(viewer); if(r&&r.catch) r.catch(()=>{});
};
document.addEventListener("fullscreenchange",()=>{ fsBtn.setAttribute("aria-pressed",String(!!document.fullscreenElement)); setTimeout(layout,60); });

document.addEventListener("keydown",ev=>{
  if(viewer.hidden){ if(ev.key==="/"&&document.activeElement!==q){ev.preventDefault();q.focus();} return; }
  if(ev.key==="Escape"){ if(document.fullscreenElement) return; ev.preventDefault(); closeViewer(); }
  else if(ev.key==="ArrowRight"){ ev.preventDefault(); step(1); }
  else if(ev.key==="ArrowLeft"){ ev.preventDefault(); step(-1); }
  else if(ev.key==="+"||ev.key==="="){ ev.preventDefault(); setZoom(1); }
  else if(ev.key==="-"||ev.key==="_"){ ev.preventDefault(); setZoom(-1); }
  else if(ev.key==="0"){ mode="fit"; layout(); }
  else if(ev.key==="Tab"){
    const f=[...viewer.querySelectorAll("button:not([hidden])")].filter(b=>b.offsetParent!==null);
    if(!f.length) return; const a=f[0], z=f[f.length-1];
    if(ev.shiftKey&&document.activeElement===a){ev.preventDefault();z.focus();}
    else if(!ev.shiftKey&&document.activeElement===z){ev.preventDefault();a.focus();}
  }
});
let sx=null,sy=null;
canvas.addEventListener("touchstart",ev=>{ if(ev.touches.length!==1){sx=null;return} sx=ev.touches[0].clientX; sy=ev.touches[0].clientY; },{passive:true});
canvas.addEventListener("touchend",ev=>{
  if(sx==null) return; const t=ev.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy; sx=null;
  if(canvas.scrollWidth<=canvas.clientWidth+4 && Math.abs(dx)>60 && Math.abs(dy)<60) step(dx<0?1:-1);
},{passive:true});
canvas.addEventListener("dblclick",()=>{ mode=mode==="fit"?"width":"fit"; layout(); });

update(true);
const h=(location.hash||"").slice(1).toUpperCase();
let hi=ENSAIOS.findIndex(e=>e.reg===h); if(hi<0) hi=ENSAIOS.findIndex(e=>e.code===h);
if(hi>=0) openViewer(hi);
