<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13241a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="ime.png">
<link rel="apple-touch-icon" href="ime.png">
<title>Biblioteca de Ensaios LET</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: fundo verde de apresentação militar; capa enxuta, faixa de filtros por camada, grade de dossiês; clique abre visualizador em tela cheia tipo slide */
:root{
  color-scheme: dark;
  --bg:#13241a;          /* verde oliva profundo */
  --bg-2:#1a3022;        /* superfície */
  --bg-3:#22402d;        /* superfície elevada */
  --line:#335a40;        /* fios */
  --fg:#e9efe3;          /* texto */
  --muted:#9fb59f;       /* texto secundário */
  --khaki:#d4c48a;       /* acento cáqui */
  --paper:#f3f1e8;       /* folha de relatório */
  --ink:#1f2a22;         /* tinta da folha */
  --display:"Saira Extra Condensed","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;
  background:
    radial-gradient(1200px 600px at 85% -10%, #2b5236 0%, transparent 60%),
    radial-gradient(900px 500px at -10% 110%, #1d3a27 0%, transparent 55%),
    var(--bg);
  background-attachment:fixed;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,4vw,40px);padding-block:clamp(28px,5vw,56px) 64px}

/* capa */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top .tag{border:1px solid var(--line);padding:5px 10px;border-radius:2px}
.hero{margin-top:0;display:flex;gap:clamp(18px,3vw,36px);align-items:center}
.crest{width:clamp(84px,13vw,170px);height:auto;flex:none;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.hero-txt{min-width:0}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--khaki)}
h1{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.88;
  font-size:clamp(52px,9vw,112px);margin:10px 0 0;letter-spacing:.01em;text-wrap:balance}
h1 span{color:var(--khaki)}
.lede{color:var(--muted);max-width:44ch;margin:0}
.lede strong{color:var(--fg);font-weight:600}
.stats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--display);font-size:40px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums}
.stat small{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* perfil do pavimento = filtro */
.profile{margin-top:clamp(32px,5vw,52px);border-top:1px solid var(--line);padding-top:18px}
.profile-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.profile-head h2{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:22px;letter-spacing:.06em;margin:0}
.profile-head p{margin:0;font-size:13px;color:var(--muted)}
.layers{display:flex;flex-direction:column;gap:3px}
.layer{all:unset;cursor:pointer;display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;align-items:center;gap:14px;
  padding:9px 14px;border-radius:2px;font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;color:var(--fg);
  background:var(--c);position:relative;transition:transform .25s ease, filter .25s ease, outline-color .2s}
.layer .nm{text-transform:uppercase;font-weight:500}
.layer .codes{color:inherit;opacity:.8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layer .n{font-variant-numeric:tabular-nums;opacity:.85}
.layer:hover{transform:translateX(6px)}
.layer:focus-visible{outline:2px solid var(--khaki);outline-offset:2px}
.layer[aria-pressed="true"]{outline:2px solid var(--khaki);outline-offset:2px}
.layers.filtering .layer[aria-pressed="false"]{filter:saturate(.35) brightness(.7)}
.l-rev{--c:#2a2a26}
.l-base{--c:#6b5a3e}
.l-sub{--c:#7d6a48}
.l-ref{--c:#8a6e4a}
.l-subl{--c:#5b4632}
.hint{font-family:var(--body);font-weight:400;font-size:14px;letter-spacing:0;text-transform:none;color:var(--muted);margin-left:6px}
.clear{all:unset;cursor:pointer;font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--khaki);border-bottom:1px solid currentColor}
.clear:focus-visible{outline:2px solid var(--khaki);outline-offset:3px}

/* grade */
.grid{margin-top:36px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.card{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:12px;min-width:0;
  animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 55ms)}
@keyframes rise{from{transform:translateY(18px)}to{transform:none}}
.card[hidden]{display:none!important}
.card:focus-visible .sheet-wrap{outline:2px solid var(--khaki);outline-offset:4px}
.sheet-wrap{position:relative;aspect-ratio:1075/1521;max-width:100%;perspective:900px}
.sheet{position:absolute;inset:0;transition:transform .45s cubic-bezier(.2,.7,.2,1), box-shadow .45s;
  box-shadow:0 14px 30px -14px rgba(0,0,0,.7), 0 2px 0 rgba(0,0,0,.25);transform-origin:50% 100%}
.sheet-wrap::before,.sheet-wrap::after{content:"";position:absolute;inset:0;background:var(--paper);opacity:.18;border-radius:1px;transition:transform .45s}
.sheet-wrap::before{transform:translate(6px,6px) rotate(1.4deg)}
.sheet-wrap::after{transform:translate(3px,3px) rotate(.6deg);opacity:.3}
.card:hover .sheet{transform:translateY(-8px) rotateX(4deg);box-shadow:0 28px 40px -16px rgba(0,0,0,.8)}
.card:hover .sheet-wrap::before{transform:translate(10px,4px) rotate(3deg)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.code{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:.04em;color:var(--fg)}
.idx{font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.name{font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:-6px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:var(--c);color:#efe9da}

/* folha (placeholder de relatório) ou imagem real */
.page{position:absolute;inset:0;background:var(--paper);overflow:hidden;border-radius:1px}
.page img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}

/* visualizador */
.viewer{position:fixed;inset:0;z-index:20;background:rgba(9,18,12,.94);backdrop-filter:blur(6px);
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 14px) clamp(16px,3vw,36px) calc(env(safe-area-inset-bottom,0px) + 14px)}
.viewer[hidden]{display:none!important}
.v-top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.v-count b{color:var(--fg);font-variant-numeric:tabular-nums}
.btn{all:unset;cursor:pointer;display:inline-grid;place-items:center;min-width:42px;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:2px;
  color:var(--fg);font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:background .2s,border-color .2s}
.btn:hover{background:var(--bg-3);border-color:var(--khaki)}
.btn:focus-visible{outline:2px solid var(--khaki);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(20px,4vw,56px);align-items:center;min-height:0;
  max-width:1180px;width:100%;margin:0 auto;padding-block:18px}
.v-info{min-width:0;max-height:100%;overflow:auto;padding-right:4px}
.v-code{font-family:var(--display);font-weight:800;font-size:clamp(64px,11vw,150px);line-height:.82;letter-spacing:.02em;color:var(--khaki)}
.v-name{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:clamp(24px,3vw,38px);line-height:1;margin:10px 0 6px;text-wrap:balance}
.v-norm{font-family:var(--mono);font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.v-desc{margin:18px 0 0;max-width:58ch}
.v-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin-top:22px;background:var(--line);border:1px solid var(--line)}
.v-grid div{background:var(--bg-2);padding:12px 14px;min-width:0}
.v-grid dt{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.v-grid dd{margin:4px 0 0;font-size:14px}
.v-bottom{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{all:unset;cursor:pointer;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:4px 6px;border-radius:2px;color:var(--muted)}
.dot[aria-current="true"]{background:var(--khaki);color:#1b2a1f}
.dot:focus-visible{outline:2px solid var(--khaki)}
.stage.anim .v-sheet{animation:sheetIn .6s cubic-bezier(.2,.7,.2,1)}
.stage.anim .v-info>*{animation:infoIn .55s cubic-bezier(.2,.7,.2,1) both}
.stage.anim .v-info>*:nth-child(2){animation-delay:.05s}
.stage.anim .v-info>*:nth-child(3){animation-delay:.1s}
.stage.anim .v-info>*:nth-child(4){animation-delay:.15s}
.stage.anim .v-info>*:nth-child(5){animation-delay:.2s}
@keyframes sheetIn{from{transform:translateX(calc(var(--dir,1) * 60px)) rotate(calc(var(--dir,1) * 3deg));opacity:0}to{transform:none;opacity:1}}
@keyframes infoIn{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}

footer{margin-top:56px;border-top:1px solid var(--line);padding-top:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

@media (max-width:980px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .layer{grid-template-columns:minmax(0,1fr) auto}
  .layer .codes{display:none}
  .stage{grid-template-columns:minmax(0,1fr);align-content:start;overflow:auto}
  .v-code{font-size:72px}
  .dots{display:none}
}

.page img{object-fit:cover;object-position:top}
.sheet .st{position:absolute;left:8px;bottom:8px;z-index:2}
.st{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 7px;border-radius:2px;font-weight:500;white-space:nowrap}
.st-ok{background:#2f6b3f;color:#e6f4e6}
.st-bad{background:#8c2f22;color:#fbe9e5}
.st-warn{background:#9a6b1c;color:#fff4dd}
.st-info{background:#3a4a3e;color:#dfe8dc}
.v-left{display:flex;flex-direction:column;align-items:flex-end;gap:10px;min-height:0;min-width:0}
.v-sheet{all:unset;cursor:zoom-in;display:block;position:relative;height:min(70vh,800px);aspect-ratio:1075/1521;max-width:100%;background:var(--paper);
  box-shadow:0 40px 80px -30px rgba(0,0,0,.9);overflow:hidden}
.v-sheet img{width:100%;height:100%;object-fit:contain;display:block}
.v-sheet:focus-visible{outline:2px solid var(--khaki);outline-offset:4px}
.v-pages{display:flex;gap:6px;min-height:30px}
.pgbtn{all:unset;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border:1px solid var(--line);border-radius:2px;color:var(--muted)}
.pgbtn[aria-pressed="true"]{background:var(--khaki);color:#1b2a1f;border-color:var(--khaki)}
.pgbtn:focus-visible{outline:2px solid var(--khaki)}
.v-codeline{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.v-reg{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-bottom:10px}
.v-res{margin-top:20px;border:1px solid var(--line);background:var(--bg-2)}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.res-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.res-row div{padding:12px 14px;min-width:0;border-right:1px solid var(--line)}
.res-row div:last-child{border-right:0}
.res-row small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted)}
.res-row b{display:block;font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.zoom{position:fixed;inset:0;z-index:30;background:rgba(6,12,8,.97);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 64px) 16px 32px;display:flex;justify-content:center;align-items:flex-start}
.zoom[hidden]{display:none!important}
.zoom img{width:min(1075px,100%);height:auto;max-width:100%;box-shadow:0 30px 60px -20px #000}
.zoom-x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;background:var(--bg)}
@media (max-width:760px){
  .v-left{align-items:center}
  .v-sheet{height:auto;width:min(62vw,300px)}
  #v-layer{display:none}
  .stage{padding-top:14px;gap:22px}
  .v-info{overflow:visible;max-height:none}
  .v-code{font-size:64px;line-height:.9}
  .res-row b{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>


<div class="wrap">
  <header class="hero">
    <img class="crest" src="ime.png" alt="Brasão do IME" width="120" height="160">
    <div class="hero-txt">
      <h1>Biblioteca de <span>Ensaios</span></h1>
      <div class="stats">
        <div class="stat"><b>12</b><small>Ensaios</small></div>
      </div>
    </div>
  </header>

  <section class="profile" aria-label="Filtrar por camada">
    <div class="profile-head">
      <h2>Filtrar por camada <span class="hint">(clique sobre a camada, se desejar)</span></h2>
      <p><button class="clear" id="clear" hidden>Mostrar todos</button></p>
    </div>
    <div class="layers" id="layers"></div>
  </section>

  <main class="grid" id="grid"></main>

</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="v-name">
  <div class="v-top">
    <span class="v-count"><b id="v-i">01</b> / 12</span>
    <span id="v-layer"></span>
    <button class="btn" id="v-close" aria-label="Fechar">Fechar ✕</button>
  </div>
  <div class="zoom" id="zoom" hidden><img id="zoom-img" alt=""><button class="btn zoom-x" id="zoom-x">Fechar ampliação ✕</button></div>
  <div class="stage" id="stage">
    <div class="v-left">
      <button class="v-sheet" id="v-sheet" aria-label="Ampliar folha"></button>
      <div class="v-pages" id="v-pages"></div>
    </div>
    <div class="v-info">
      <div class="v-codeline"><div class="v-code" id="v-code"></div><div class="v-reg" id="v-reg"></div></div>
      <h2 class="v-name" id="v-name"></h2>
      <div class="v-norm" id="v-norm"></div>
      <p class="v-desc" id="v-desc"></p>
    </div>
  </div>
  <div class="v-bottom">
    <button class="btn" id="v-prev" aria-label="Ensaio anterior">← Anterior</button>
    <div class="dots" id="dots"></div>
    <button class="btn" id="v-next" aria-label="Próximo ensaio">Próximo →</button>
  </div>
</div>

<script>
/* Para usar a imagem real de cada relatório, preencha "img" com o caminho/data URI da 1ª página do PDF. */
const LAYERS = [
  {id:"rev",  nome:"Revestimento",          cls:"l-rev"},
  {id:"base", nome:"Base",                  cls:"l-base"},
  {id:"sub",  nome:"Sub-base",              cls:"l-sub"},
  {id:"ref",  nome:"Reforço do subleito",   cls:"l-ref"},
  {id:"subl", nome:"Subleito",              cls:"l-subl"}
];
const SOLO = ["base","sub","ref","subl"];
const ENSAIOS = [
  {code:"ATT", reg:"ATT-003", pags:1, nome:"Limites de Atterberg", norma:"NBR 6459 · NBR 7180", camadas:SOLO,
   desc:"Determina o limite de liquidez e o limite de plasticidade do solo, e daí o índice de plasticidade. Indica a sensibilidade do material à água e serve de critério de aceitação de solos para as camadas do pavimento.",
   mede:"LL, LP e IP (%)", amostra:"Fração passante na peneira nº 40", uso:"Classificação SUCS/TRB e aceitação de jazidas",
   res:[["LL","43,4 %"],["LP","18,4 %"],["IP","25,0 %"],["SUCS","CL"]], status:"Alta plasticidade", st:"info", local:"Subleito · Est 5+00 a 7+00"},
  {code:"TUM", reg:"TUM-004", pags:1, nome:"Teor de Umidade", norma:"DNIT 456/2025-ME (estufa)", camadas:SOLO,
   desc:"Mede a quantidade de água presente no solo em relação à massa seca. É o dado de partida para a compactação em campo e para conferir se a camada está dentro da faixa de umidade especificada.",
   mede:"Umidade w (%)", amostra:"Solo coletado na pista ou na jazida", uso:"Liberação da compactação",
   res:[["w médio","14,79 %"],["w máx","14,86 %"],["w mín","14,72 %"],["Dif. máx","0,14"]], status:"Concluído", st:"info", local:"Sub-base · Est 10+00 a 12+00"},
  {code:"GRS", reg:"GRS-002", pags:2, nome:"Granulometria de Solos", norma:"DNIT 459/2025-ME", camadas:SOLO,
   desc:"Distribui o solo por tamanho de grão por peneiramento e sedimentação. A curva granulométrica, junto com os limites de Atterberg, classifica o solo e indica seu comportamento como subleito.",
   mede:"% passante por peneira", amostra:"Solo seco ao ar", uso:"Classificação SUCS e HRB",
   res:[["SUCS","SC"],["HRB","A-7-6"],["IG","3"],["D60","0,35 mm"]], status:"Subleito muito ruim", st:"warn", local:"Subleito · Est 5+00 a 7+00"},
  {code:"GRA", reg:"GRA-003", pags:2, nome:"Granulometria de Agregados", norma:"DNIT 412/2025-ME", camadas:["rev","base","sub"],
   desc:"Peneiramento de agregados graúdos e miúdos usados em bases granulares e misturas asfálticas. O resultado é comparado com as faixas granulométricas da especificação de serviço.",
   mede:"% passante por peneira", amostra:"Brita, pedrisco, areia, pó", uso:"Enquadramento na faixa DNIT",
   res:[["Material","Brita 1"],["MF","5,95"],["Dmáx","19,0 mm"]], status:"Classificado", st:"info", local:"Base · Est 12+00 a 14+00"},
  {code:"PRO", reg:"PRO-003", pags:1, nome:"Compactação Proctor", norma:"NBR 7182:2020", camadas:SOLO,
   desc:"Compacta o solo em cilindro padronizado com teores de umidade crescentes para obter a curva de compactação. Define a massa específica aparente seca máxima e a umidade ótima, referências de todo o controle de campo.",
   mede:"γd máx (g/cm³) e w ótima (%)", amostra:"Solo da jazida ou da pista", uso:"Referência para o grau de compactação",
   res:[["γd máx","1,902 g/cm³"],["w ótima","14,21 %"],["Energia","Normal"]], status:"Referência", st:"info", local:"Sub-base · Est 10+00 a 12+00"},
  {code:"CBR", reg:"CBR-003", pags:1, nome:"Índice de Suporte Califórnia", norma:"NBR 9895", camadas:SOLO,
   desc:"Mede a resistência à penetração do solo compactado e imerso por quatro dias, comparada a uma brita padrão, e registra a expansão. É o principal parâmetro do dimensionamento pelo método do DNER.",
   mede:"CBR (%) e expansão (%)", amostra:"Corpos de prova compactados", uso:"Dimensionamento e aceitação de camadas",
   res:[["CBR 2,54","22,63 %"],["CBR 5,08","24,09 %"],["Expansão","0,535 %"],["Limite","≤ 0,5 %"]], status:"Reprovado", st:"bad", local:"Sub-base · Est 10+00 a 12+00"},
  {code:"DIS", reg:"DIS-004", pags:1, nome:"Densidade In Situ", norma:"NBR 7185:2016 (frasco de areia)", camadas:SOLO,

const $ = s=>document.querySelector(s);
const pad = n=>String(n).padStart(2,"0");
const layerOf = id=>LAYERS.find(l=>l.id===id);

const thumb = e=>`${e.reg}-thumb.jpg`;
const pageSrc = (e,n)=>`${e.reg}-${n}.jpg`;
function pageHTML(e){
  return `<div class="page"><img src="${thumb(e)}" alt="Primeira página do boletim ${e.reg}" loading="lazy"></div>`;
}

/* camadas */
const layersEl = $("#layers");
LAYERS.forEach(l=>{
  const list = ENSAIOS.filter(e=>e.camadas.includes(l.id));
  const b = document.createElement("button");
  b.className = "layer "+l.cls; b.dataset.id=l.id; b.setAttribute("aria-pressed","false");
  b.innerHTML = `<span class="nm">${l.nome}</span><span class="codes">${list.map(e=>e.code).join(" · ")}</span><span class="n">${list.length} ensaios</span>`;
  b.onclick = ()=>setFilter(b.getAttribute("aria-pressed")==="true" ? null : l.id);
  layersEl.appendChild(b);
});

/* cartões */
const grid = $("#grid");
ENSAIOS.forEach((e,i)=>{
  const c = document.createElement("button");
  c.className="card"; c.style.setProperty("--i",i); c.dataset.i=i;
  c.setAttribute("aria-label",`Abrir boletim ${e.reg}, ${e.nome}`);
  c.innerHTML = `<div class="sheet-wrap"><div class="sheet">${pageHTML(e)}</div></div>
    <div class="meta"><span class="code">${e.code}</span><span class="idx">${e.reg.split("-")[1]} · ${pad(i+1)}/12</span></div>
    <div class="name">${e.nome}</div>
    <div class="chips">${e.camadas.map(id=>{const l=layerOf(id);return `<span class="chip ${l.cls}">${l.nome}</span>`}).join("")}</div>`;
  c.onclick=()=>openViewer(i,1);
  grid.appendChild(c);
});

function setFilter(id){
  layersEl.classList.toggle("filtering",!!id);
  layersEl.querySelectorAll(".layer").forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.id===id)));
  grid.querySelectorAll(".card").forEach(c=>{
    const e=ENSAIOS[+c.dataset.i];
    c.hidden = !!id && !e.camadas.includes(id);
    c.style.animation="none"; void c.offsetWidth; c.style.animation="";
  });
  $("#clear").hidden = !id;
}
$("#clear").onclick=()=>setFilter(null);

/* visualizador */
const viewer=$("#viewer"), stage=$("#stage");
let cur=0, lastFocus=null;
const dots=$("#dots");
ENSAIOS.forEach((e,i)=>{const d=document.createElement("button");d.className="dot";d.textContent=e.code; d.title=e.reg;d.onclick=()=>show(i,i>cur?1:-1);dots.appendChild(d)});
let pg=1;
function setPage(n){
  const e=ENSAIOS[cur]; pg=n;
  $("#v-sheet").innerHTML=`<img src="${pageSrc(e,n)}" alt="Boletim ${e.reg}, folha ${n} de ${e.pags}">`;
  $("#v-pages").innerHTML = e.pags>1 ? Array.from({length:e.pags},(_,k)=>`<button class="pgbtn" aria-pressed="${k+1===n}" data-p="${k+1}">Folha ${k+1}</button>`).join("") : "";
  $("#v-pages").querySelectorAll(".pgbtn").forEach(b=>b.onclick=()=>setPage(+b.dataset.p));
}
function show(i,dir){
  cur=(i+ENSAIOS.length)%ENSAIOS.length; const e=ENSAIOS[cur];
  $("#v-i").textContent=pad(cur+1);
  $("#v-layer").textContent=e.local;
  setPage(1);
  $("#v-code").textContent=e.code;
  $("#v-reg").textContent="Boletim nº "+e.reg;
  $("#v-name").textContent=e.nome;
  $("#v-norm").textContent=e.norma;
  $("#v-desc").textContent=e.desc;
  dots.querySelectorAll(".dot").forEach((d,j)=>d.setAttribute("aria-current",String(j===cur)));
  stage.style.setProperty("--dir",dir||1);
  stage.classList.remove("anim"); void stage.offsetWidth; stage.classList.add("anim");
  try{history.replaceState(null,"","#"+e.reg.toLowerCase())}catch(_){}
}
function openViewer(i,dir){
  lastFocus=document.activeElement; viewer.hidden=false; document.body.style.overflow="hidden";
  show(i,dir); $("#v-close").focus();
}
function closeViewer(){
  viewer.hidden=true; document.body.style.overflow="";
  try{history.replaceState(null,"",location.pathname+location.search)}catch(_){}
  lastFocus&&lastFocus.focus&&lastFocus.focus();
}
$("#v-close").onclick=closeViewer;
const zoom=$("#zoom");
$("#v-sheet").onclick=()=>{const e=ENSAIOS[cur];$("#zoom-img").src=pageSrc(e,pg);$("#zoom-img").alt=`Boletim ${e.reg}, folha ${pg}`;zoom.hidden=false;zoom.scrollTop=0;$("#zoom-x").focus()};
$("#zoom-x").onclick=()=>{zoom.hidden=true;$("#v-sheet").focus()};
$("#v-prev").onclick=()=>show(cur-1,-1);
$("#v-next").onclick=()=>show(cur+1,1);
viewer.addEventListener("click",ev=>{if(ev.target===viewer)closeViewer()});
document.addEventListener("keydown",ev=>{
  if(viewer.hidden) return;
  if(ev.key==="Escape"){ if(!zoom.hidden){zoom.hidden=true;return} closeViewer(); }
  if(!zoom.hidden) return;
  if(ev.key==="ArrowRight") show(cur+1,1);
  if(ev.key==="ArrowLeft") show(cur-1,-1);
});
let sx=null;
stage.addEventListener("touchstart",ev=>{sx=ev.touches[0].clientX},{passive:true});
stage.addEventListener("touchend",ev=>{if(sx==null)return;const dx=ev.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1),dx<0?1:-1);sx=null});

/* link direto: #cbr abre o CBR */
const h=(location.hash||"").slice(1).toUpperCase();
let hi=ENSAIOS.findIndex(e=>e.reg===h); if(hi<0) hi=ENSAIOS.findIndex(e=>e.code===h);
if(hi>=0) openViewer(hi,1);
</script>

</body>
</html>
